<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Stream Player</title>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<style>
:root{--bg1:#050a5e;--bg2:#1a6aa0;--panel:#0b1a4a;--card:#fff;--ink:#fff;--mut:#9fb4d8;--acc:#27c6e0;--line:#ffffff40}
[data-t=dark]{--bg1:#000;--bg2:#1c1c1c;--panel:#101010;--acc:#e5b100;--mut:#999}
[data-t=purple]{--bg1:#1b0640;--bg2:#6b2a9a;--panel:#240a52;--acc:#ff4fd8;--mut:#c9a8e8}
[data-t=green]{--bg1:#04281c;--bg2:#13805a;--panel:#07382a;--acc:#38ff9a;--mut:#9fd8c0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Tahoma,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 80%,var(--bg2),var(--bg1) 70%) fixed;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;letter-spacing:1px;margin-inline-end:auto;cursor:pointer;direction:ltr}
.ib{background:none;border:0;font-size:20px;padding:6px 9px;border-radius:8px;cursor:pointer}
.ib:hover,.ib.on{background:#ffffff25}
#main{flex:1;overflow:auto;padding:14px}
.hide{display:none!important}
.users{max-width:620px;margin:20px auto;display:grid;gap:12px}
.u{display:flex;background:var(--card);color:#111;border-radius:8px;overflow:hidden;cursor:pointer;align-items:center}
.u i{background:#181818;color:#fff;width:64px;height:56px;display:grid;place-items:center;font-style:normal;font-size:26px}
.u b{flex:1;padding:0 16px;font-weight:500;font-size:18px}
.u button{background:none;border:0;font-size:18px;padding:12px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;max-width:900px;margin:30px auto}
.tile{border:0;border-radius:14px;aspect-ratio:1/1.15;font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:space-around;cursor:pointer;color:#fff;text-shadow:0 2px 4px #0006;padding:14px}
.tile span{width:62%;aspect-ratio:1;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:44px;text-shadow:none}
.foot{display:flex;justify-content:space-between;color:var(--mut);max-width:900px;margin:auto;font-size:14px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(420px,100%);display:grid;gap:10px}
.box img.pv{max-height:170px;object-fit:contain;border-radius:8px;background:#0006}.box textarea{min-height:90px}.box pre{font-size:11px;white-space:pre-wrap;color:var(--mut);direction:ltr;max-height:100px;overflow:auto}
.box input,.box select,.box textarea{padding:11px;border-radius:8px;border:1px solid var(--line);background:#ffffff14;width:100%}
.btn{background:var(--acc);color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.g{background:#ffffff25;color:var(--ink)}
#browse{display:grid;grid-template-columns:230px 1fr;gap:10px;height:100%}
#browse.pl{grid-template-columns:230px 300px 1fr}
#browse.pl .stage{display:flex}
#browse.big{grid-template-columns:1fr}#browse.big .col{display:none}
.col{background:#00000040;border-radius:10px;overflow:auto;min-height:0}
.col .it{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid #ffffff14;cursor:pointer;font-size:14px}
.col .it:hover,.col .it.on{background:#ffffff22}
.col img{width:34px;height:34px;object-fit:contain;border-radius:5px;background:#fff2}
.col .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col input{width:calc(100% - 16px);margin:8px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#ffffff14}
.stage{display:none;flex-direction:column;gap:8px;min-height:0}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar .btn{padding:6px 11px;font-size:13px}
#grid{flex:1;display:grid;gap:6px;min-height:240px}
#grid.l1{grid-template:1fr/1fr}#grid.l2{grid-template:1fr/1fr 1fr}#grid.l4{grid-template:1fr 1fr/1fr 1fr}
.cell{position:relative;background:#000;border-radius:8px;overflow:hidden;border:2px solid transparent;min-height:120px}
.cell.act{border-color:var(--acc)}
.cell video{width:100%;height:100%;background:#000}
.cell .t{position:absolute;top:4px;inset-inline:6px;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.wis{text-align:center;color:var(--acc);font-size:20px;font-weight:700;padding:10px;margin:6px auto;max-width:620px;border:1px dashed var(--line);border-radius:12px;background:#00000030}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.rg .btn{padding:11px 0;font-size:15px}.rg .cr{color:#ff5a5a}.rg .cg{color:#4cff7a}.rg .cy{color:#ffd84d}.rg .cb{color:#4db8ff}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1;min-width:0}.row .btn{white-space:nowrap}
.vt .btn{padding:3px 9px;font-size:12px}.vt{flex-wrap:wrap;display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid #ffffff14}.vt .ib{font-size:17px;padding:3px 9px}
.ph{display:grid;place-items:center;width:34px;height:34px;background:#fff2;border-radius:5px;font-size:18px;flex:none}.ac{display:flex;flex:none}.ac .ib{font-size:15px;padding:2px 5px}
#list.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;padding:6px}
#list.v-grid .it{flex-direction:column;text-align:center;border:1px solid #ffffff22;border-radius:8px;padding:8px 4px}
#list.v-grid img,#list.v-grid .ph{width:56px;height:56px}#list.v-grid .n{white-space:normal;font-size:12px;max-height:3em}
#list.v-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
#list.v-cards .it{flex-direction:column;border:1px solid #ffffff22;border-radius:10px;padding:8px;text-align:center}
#list.v-cards img,#list.v-cards .ph{width:100%;height:80px;font-size:34px}#list.v-cards .n{white-space:normal}
#list.v-compact .it{padding:3px 8px;font-size:12px}#list.v-compact img,#list.v-compact .ph{width:18px;height:18px;font-size:12px}
@media(max-width:860px){#browse,#browse.pl,#browse.big{grid-template-columns:1fr;grid-auto-rows:minmax(150px,auto);height:auto}#grid.l4,#grid.l2{grid-template:none;grid-auto-rows:200px;grid-template-columns:1fr}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:20px;z-index:20;font-size:14px}
</style>
</head>
<body data-t="blue">
<header>
  <div class="logo" onclick="go('home')">📺 IPTV STREAM PLAYER</div>
  <button class="ib" title="بحث شامل" onclick="masterSearch()">🔍</button>
  <button class="ib" title="المفضلة" onclick="openMode('fav')">♥</button>
  <button class="ib" title="الثيمات" onclick="nextTheme()">🎨</button>
  <button class="ib" title="السيرفرات / المستخدمين" onclick="go('users')">👥</button>
  <button class="ib" title="تحديث" onclick="reload()">⟳</button>
  <button class="ib" title="ريموت التلفزيون" onclick="remoteUI()">🎮</button>
  <button class="ib" title="فيديو أونلاين" onclick="onlineUI()">🌐</button>
  <button class="ib" title="الإعدادات" onclick="settings()">⚙</button>
</header>
<div id="main"></div>

<script>
if(window.AndroidBridge){try{Object.defineProperty(navigator,'clipboard',{value:{writeText:t=>{AndroidBridge.copy(t);return Promise.resolve()}}})}catch(e){}}
const $=(s,e=document)=>e.querySelector(s);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let servers=LS('servers',[]),cur=LS('cur',-1),favs=LS('favs',[]),theme=LS('theme','blue');
let info=null,cache={},mode='',items=[],cats=[],catSel='all',layout=1,cells=[],active=0;
const themes=['blue','dark','purple','green'];
document.body.dataset.t=theme;

/* القنوات المجانية: قابلة للبحث والتعديل والحذف (تُحفظ في المتصفح). الروابط عامة وقد تتغير */
const DEF_FREE=[
 {name:'مكة المكرمة',url:'http://megatv.cx:80/live/0109470260/8433581735/1130.m3u8',cat:'مكة والمدينة',type:'tv'},
 {name:'المدينة المنورة',url:'http://megatv.cx:80/live/0109470260/8433581735/2628.m3u8',cat:'مكة والمدينة',type:'tv'},
 {name:'الجزيرة',url:'https://live-hls-web-aja.getaj.net/AJA/index.m3u8',cat:'أخبار',type:'tv'},
 {name:'العربية',url:'https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8',cat:'أخبار',type:'tv'},
 {name:'سكاي نيوز عربية',url:'https://stream.skynewsarabia.com/hls/sna.m3u8',cat:'أخبار',type:'tv'},
 {name:'النيل للأخبار',url:'https://nile-news.akamaized.net/hls/live/2037693/nile-news/index.m3u8',cat:'أخبار',type:'tv'},
 {name:'فرانس 24 عربي',url:'https://live.france24.com/hls/live/2037222-b/F24_AR_HI_HLS/master_5000.m3u8',cat:'أخبار',type:'tv'},
 {name:'DW عربية',url:'https://dwamdstream103.akamaized.net/hls/live/2015526/dwstream103/index.m3u8',cat:'أخبار',type:'tv'},
 {name:'إذاعة القرآن الكريم - القاهرة',url:'https://stream.radiojar.com/8s5u5tpdtwzuv',cat:'إذاعات مصرية',type:'radio'},
 {name:'نايل إف إم',url:'https://audio.nrpstream.com/listen/nile_fm/radio.mp3',cat:'إذاعات مصرية',type:'radio'},
 {name:'نجوم إف إم',url:'https://audio.nrpstream.com/listen/nogoum_fm/radio.mp3',cat:'إذاعات مصرية',type:'radio'},
 {name:'راديو مصر',url:'https://live.radiomasr.net/RADIOMASR',cat:'إذاعات مصرية',type:'radio'},
 {name:'مونت كارلو الدولية',url:'https://montecarlodoualiya128k.ice.infomaniak.ch/mc-doualiya.mp3',cat:'إذاعات عربية',type:'radio'}
];
let freeList=LS('free',null)||DEF_FREE.map(x=>({...x}));
let view=LS('view','list');if(!['list','grid'].includes(view))view='list';let freeT='all';
if(LS('freev',0)<2){freeList=freeList.filter(x=>!/holol\.se/.test(x.url));DEF_FREE.slice(0,2).reverse().forEach(d=>{if(!freeList.some(x=>x.url===d.url))freeList.unshift({...d})});SV('free',freeList);SV('freev',2)}

function toast(m){const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)}
function nextTheme(){theme=themes[(themes.indexOf(theme)+1)%themes.length];document.body.dataset.t=theme;SV('theme',theme);toast('الثيم: '+theme)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function base(s){let u=s.url.trim().replace(/\/+$/,'');if(!/^https?:\/\//.test(u))u='http://'+u;return u}

/* ---------- الصفحات ---------- */
function go(v){destroyAll();if(v==='users'||cur<0||!servers[cur])return users();v==='home'?home():users()}
function users(){
  $('#main').innerHTML=wisdom()+`<div class="users">${servers.map((s,i)=>`<div class="u" onclick="pick(${i})"><i>👤</i><b>${esc(s.name||s.user)}${s.type==='m3u'?' (M3U)':''}</b><button onclick="event.stopPropagation();exportM3U(${i})" title="تصدير M3U">⬇</button><button onclick="event.stopPropagation();delSrv(${i})" title="حذف">🗑</button></div>`).join('')||'<div class="empty">لا توجد سيرفرات. أضف أول سيرفر.</div>'}
  <button class="btn" onclick="addSrv()">＋ إدخال سيرفر أو M3U</button>
  <button class="btn" onclick="imgAdd()">📷 إضافة من صورة</button>
  
  <button class="btn g" onclick="openFree('free')">قنوات مجانية (مكة والمدينة • أخبار)</button>
  <button class="btn g" onclick="openFree('radio')">راديو عربي ومصري</button>
  <button class="btn g" onclick="openFree('free');editCh(-1)">＋ إضافة قناة للمجانية</button></div>`;
}
function copy(t){return(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('تم النسخ'),()=>prompt('انسخ من هنا:',t))}
function addSrv(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" style="max-height:92vh;overflow:auto"><h3>إدخال سيرفر أو M3U</h3>
  <input id="a1" placeholder="الاسم (اختياري)">
  <div class="row"><input id="a2" placeholder="اسم المستخدم" dir="ltr"><button class="btn g cp" data-f="a2">نسخ</button></div>
  <div class="row"><input id="a3" placeholder="كلمة المرور" dir="ltr"><button class="btn g cp" data-f="a3">نسخ</button></div>
  <div class="row"><input id="a4" placeholder="http://host:port" dir="ltr"><button class="btn g cp" data-f="a4">نسخ</button></div>
  <div class="row"><button class="btn" id="toM">⬇ سيرفر ← M3U</button><button class="btn" id="toS">⬆ M3U ← سيرفر</button></div>
  <div class="row"><input id="m1" placeholder="رابط M3U" dir="ltr"><button class="btn g cp" data-f="m1">نسخ</button></div>
  <input type="file" id="mf" accept=".m3u,.m3u8,.txt"><textarea id="mt" placeholder="أو الصق محتوى M3U هنا" dir="ltr"></textarea>
  <div class="row"><button class="btn g cp" data-f="mt">نسخ المحتوى</button><button class="btn g" id="dlb">تحميل .m3u</button></div>
  <div id="mr" style="font-size:13px;color:var(--mut)"></div>
  <div class="row"><button class="btn" id="sv">حفظ السيرفر</button><button class="btn g" id="sm">حفظ كقائمة M3U</button><button class="btn g" id="op">▶ فتح</button></div>
  <button class="btn g" id="no">إغلاق</button></div>`;
  document.body.append(m);const q=x=>$(x,m),msg=t=>q('#mr').textContent=t;
  m.querySelectorAll('.cp').forEach(b=>b.onclick=()=>copy(q('#'+b.dataset.f).value));
  q('#no').onclick=()=>m.remove();
  const get=()=>({name:q('#a1').value.trim(),user:q('#a2').value.trim(),pass:q('#a3').value.trim(),url:q('#a4').value.trim()});
  q('#toM').onclick=async()=>{const s=get();if(!s.user||!s.pass||!s.url)return toast('أكمل بيانات السيرفر');
    const link=`${base(s)}/get.php?username=${encodeURIComponent(s.user)}&password=${encodeURIComponent(s.pass)}&type=m3u_plus&output=ts`;
    q('#m1').value=link;copy(link);msg('تم نسخ رابط M3U. جاري بناء الملف الكامل...');
    try{const t=await buildM3U(s);q('#mt').value=t;msg(`تم بناء ${(t.match(/#EXTINF/g)||[]).length} عنصر — انسخه أو حمّله`)}
    catch(e){msg('الرابط جاهز ومنسوخ، لكن تعذر بناء الملف داخل المتصفح (CORS)')}};
  q('#toS').onclick=async()=>{let t=q('#mt').value,u=q('#m1').value.trim();
    try{const f=q('#mf').files[0];if(f){t=await f.text();q('#mt').value=t}else if(!t&&u&&!m3uCreds(u))t=await fetch(u).then(r=>r.text())}catch(e){}
    const it=t?parseM3U(t):[];let c=(u&&m3uCreds(u))||(it.length&&m3uCreds(it[0].url));
    if(c){q('#a2').value=c.user;q('#a3').value=c.pass;q('#a4').value=c.url;msg(`تم استخراج بيانات السيرفر${it.length?' — '+it.length+' عنصر':''}. يمكنك نسخ كل حقل أو حفظه`)}
    else msg(it.length?`${it.length} عنصر، لكن لا توجد بيانات Xtream في الروابط (يمكن حفظها كقائمة M3U)`:'تعذر القراءة: ألصق المحتوى أو اختر الملف')};
  q('#dlb').onclick=()=>q('#mt').value?dl('playlist.m3u',q('#mt').value,'audio/x-mpegurl'):toast('لا يوجد محتوى');
  q('#sv').onclick=()=>{const s=get();if(!s.user||!s.pass||!s.url)return toast('أكمل بيانات السيرفر');pushSrv(s);m.remove()};
  q('#sm').onclick=()=>{const t=q('#mt').value,u=q('#m1').value.trim();if(!t&&!u)return toast('أدخل رابط أو محتوى M3U');
    pushSrv({name:get().name||'M3U',type:'m3u',m3u:t,m3uUrl:u,user:'',pass:'',url:''});m.remove()};
  q('#op').onclick=async()=>{let t=q('#mt').value,u=q('#m1').value.trim();
    try{if(!t&&u)t=await fetch(u).then(r=>r.text())}catch(e){return msg('تعذر جلب الرابط (CORS) — الصق المحتوى')}
    const it=parseM3U(t);if(!it.length)return msg('لا توجد قنوات');m.remove();openPlaylist(it,'M3U')};
}
function delSrv(i){if(!confirm('حذف هذا السيرفر؟'))return;servers.splice(i,1);SV('servers',servers);if(cur===i)cur=-1;SV('cur',cur);users()}
async function pick(i){
  cur=i;SV('cur',i);cache={};info=null;
  if(servers[i].type==='m3u'){let t=servers[i].m3u;try{if(!t)t=await fetch(servers[i].m3uUrl).then(r=>r.text())}catch(e){return toast('تعذر جلب M3U (CORS)')}return openPlaylist(parseM3U(t),servers[i].name)}
  toast('جاري الاتصال...');
  try{const r=await fx(`${base(servers[i])}/player_api.php?username=${encodeURIComponent(servers[i].user)}&password=${encodeURIComponent(servers[i].pass)}`,null,20000);
    info=await r.json();if(!info.user_info||info.user_info.auth===0)throw 0;}
  catch(e){toast('تعذر الاتصال: تحقق من البيانات أو CORS/‏HTTPS');return}
  home();
}
function home(){
  const exp=info?.user_info?.exp_date?new Date(info.user_info.exp_date*1000).toLocaleDateString('en-GB'):'—';
  const t=[['live','LIVE TV','📺','linear-gradient(#f00,#a00d18)'],['vod','MOVIES','🎬','linear-gradient(#e6b400,#8a6a10)'],['series','SERIES','🎞','linear-gradient(#ff00d0,#ff0090)'],['catch','CATCH UP','🕘','linear-gradient(#1eff00,#128a10)']];
  $('#main').innerHTML=wisdom()+`<div class="tiles">${t.map(x=>`<button class="tile" style="background:${x[3]}" onclick="openMode('${x[0]}')">${x[1]}<span>${x[2]}</span></button>`).join('')}</div>
  <div class="foot"><span>Expire: ${exp}</span><span>${esc(servers[cur]?.name||servers[cur]?.user||'')}</span></div>
  <div class="tiles"><button class="btn g" onclick="openFree('free')">قنوات عربية مجانية</button><button class="btn g" onclick="openFree('radio')">راديو</button></div>`;
}

/* ---------- جلب البيانات ---------- */
const SRV=['live','vod','series','catch'];let _cap=100;
function fx(u,o,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||25000);return fetch(u,{...(o||{}),signal:c.signal}).finally(()=>clearTimeout(t))}
async function api(action,extra=''){
  const key=action+extra;if(cache[key])return cache[key];const s=servers[cur];
  const r=await fx(`${base(s)}/player_api.php?username=${encodeURIComponent(s.user)}&password=${encodeURIComponent(s.pass)}&action=${action}${extra}`,null,40000);
  return cache[key]=await r.json();
}
function srvUrl(path){const s=servers[cur];return `${base(s)}/${path.replace('{u}',encodeURIComponent(s.user)).replace('{p}',encodeURIComponent(s.pass))}`}
function mapItem(k,x){
  if(k==='live')return{name:x.name,icon:x.stream_icon,cat:x.category_id,arch:x.tv_archive,url:srvUrl(`live/{u}/{p}/${x.stream_id}.m3u8`)};
  if(k==='vod')return{name:x.name,icon:x.stream_icon,cat:x.category_id,url:srvUrl(`movie/{u}/{p}/${x.stream_id}.${x.container_extension||'mp4'}`)};
  return{name:x.name,icon:x.cover,cat:x.category_id,series:x.series_id};
}
async function openMode(m){
  if(m!=='fav'&&cur<0)return users();
  mode=m;catSel='all';_cap=100;shell();
  if(m==='fav'){cats=[];items=favs;renderCats();renderItems();return}
  const L=$('#cats');L.innerHTML='<div class="empty">جاري التحميل...</div>';
  const k={live:'live',catch:'live',vod:'vod',series:'series'}[m];window._k=k;
  try{cats=await api(`get_${k}_categories`)}catch(e){L.innerHTML='<div class="empty">فشل التحميل (تحقق من الاتصال أو CORS)</div>';return}
  if(mode!==m)return;
  items=[];renderCats();

function parseCreds(t){
  const r={user:'',pass:'',url:''},val=l=>l.replace(/^[^:=：]*[:=：]\s*/,'').trim();
  for(const l0 of t.split(/\r?\n/)){const l=l0.trim();if(!l)continue;

    if(!r.url&&h)r.url=h[0];
    else if(!r.url&&/(url|host|server|portal|سيرفر|رابط)/i.test(l)&&/[:=].+/.test(l))r.url=val(l).replace(/\s/g,'');
    if(!r.user&&/(user(name)?|يوزر|مستخدم|login)/i.test(l)&&/[:=]/.test(l))r.user=val(l);
    if(!r.pass&&/(pass(word)?|باسورد|كلمة|pwd)/i.test(l)&&/[:=]/.test(l))r.pass=val(l);}
  const m=t.match(/username=([^&\s]+)&password=([^&\s]+)/i);if(m){r.user=r.user||m[1];r.pass=r.pass||m[2]}
  return r;
}

function parseM3U(t){const out=[];let m=null;
  for(const l of t.split(/\r?\n/)){const s=l.trim();if(!s)continue;
    if(s.startsWith('#EXTINF'))m={name:(s.split(',').slice(1).join(',')||'').trim(),icon:(s.match(/tvg-logo="([^"]*)"/)||[])[1],cat:(s.match(/group-title="([^"]*)"/)||[])[1]||'—'};
    else if(s[0]!=='#'&&m){m.url=s;out.push(m);m=null}}
  return out}
function m3uCreds(u){
  let m=u.match(/^(https?:\/\/[^\/\s?]+).*[?&]username=([^&\s]+)&password=([^&\s]+)/i);
